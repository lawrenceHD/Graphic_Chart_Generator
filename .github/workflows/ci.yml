name: CI

on:
  pull_request:
  # Every pushed branch is verified: agents relay their work through branches (journal/PROTOCOL.md).
  push:
    branches: ['**']

# Least privilege: the pipeline only reads the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (gitleaks + pnpm verify)
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned by commit SHA (tag in the trailing comment) so a moved tag cannot change the pipeline.
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # On failure the error lines become annotations, readable through the public API without a token,
      # so any agent can diagnose CI (job logs require authentication).
      - name: Run verify
        shell: bash
        run: |
          set -o pipefail
          if ! pnpm verify 2>&1 | tee verify.log; then
            grep -E 'error|✖|FAIL|×|Error|warn' verify.log | tail -40 | sed 's/^/::error::/'
            exit 1
          fi
